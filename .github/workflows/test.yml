name: Build and Deploy Python App to Azure App Service (Dev Slot)

on:
  push:
    branches:
      - feature/dev

env:
  AZURE_WEBAPP_NAME: 'test-dpr-fastapi'  # TODO: Your App Service Name
  AZURE_SLOT_NAME: 'dev'                      # Target slot name
  PYTHON_VERSION: '3.11'                      # MUST be 3.11 to match Azure Linux App Service

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Compile and install dependencies locally for deploy
        run: |
          # 1. Generate requirements.txt from pyproject.toml
          uv pip compile pyproject.toml -o requirements.txt
          
          # 2. Install all dependencies (including uvicorn) into a local folder
          # Using --python 3.11 ensures compatibility with Azure App Service
          uv pip install -r requirements.txt --target .python_packages/lib/site-packages

      - name: Remove any cached Oryx manifests or tarballs before zipping
        run: |
          # Ensure no stale Oryx manifests or venv tarballs ever get zipped
          rm -f oryx-manifest.toml *.tar.gz
          rm -rf antenv .venv

      - name: Create deployment artifact (Zip)
        run: |
          # Zip the code AND the .python_packages folder, explicitly excluding venvs
          zip -r release.zip ./* .python_packages/ -x "*.git*" "*.venv*" "*antenv*" "*.tar.gz" "*__pycache__*"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip
          retention-days: 1

  deploy:
    name: Deploy to Dev Slot
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Unzip artifact
        run: unzip -o release.zip

      - name: Log in to Azure using Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service Slot
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_NAME }}
          package: .
          # Crucial: Wipes lingering files (like old antenv tar.gz archives) from the server
          clean: true
          # Crucial: Explicitly point PYTHONPATH to our bundled .python_packages folder
          startup-command: 'PYTHONPATH=/home/site/wwwroot/.python_packages/lib/site-packages python -m uvicorn app.main:app --host 0.0.0.0 --port 8000'

      - name: Log out of Azure
        run: az logout
        if: always()
