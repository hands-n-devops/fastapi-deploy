name: Build and Deploy Python App to Azure App Service (Dev Slot)

on:
  push:
    branches:
      - feature/dev  # Or trigger on 'develop' depending on your branching strategy


env:
  AZURE_WEBAPP_NAME: 'test-dpr-fastapi'  # TODO: Replace with your Azure App Service name
  AZURE_SLOT_NAME: 'dev'                      # Target slot name
  PYTHON_VERSION: '3.11'                      # TODO: Match your Azure App Service Python runtime

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate requirements.txt for Azure App Service
        run: |
          # Compile dependencies from pyproject.toml into requirements.txt
          # Azure Oryx build engine uses this file to install packages on the slot
          uv pip compile pyproject.toml -o requirements.txt
          uv pip install -r requirements.txt --target .python_packages/lib/site-packages

      # Optional: Run automated checks/tests before packaging
      # - name: Install dev dependencies & run tests
      #   run: |
      #     uv sync --dev
      #     uv run pytest

      - name: Create deployment artifact (Zip)
        run: |
          zip -r release.zip ./* .python_packages/ -x "*.git*" "*.venv*" "*__pycache__*"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip
          retention-days: 1

  deploy:
    name: Deploy to Dev Slot
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Unzip artifact
        run: unzip -o release.zip

      - name: Log in to Azure using Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service Slot
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_NAME }}
          # Path to deploy; deploying the unzipped workspace directory
          package: .
          startup-command: 'python -m uvicorn app.main:app --host 0.0.0.0 --port 8000'

      - name: Log out of Azure
        run: |
          az logout
        if: always()
